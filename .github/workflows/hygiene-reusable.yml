name: Repository Hygiene (reusable)

on:
  workflow_call:
    inputs:
      verify-command:
        description: "Command that runs the repository's hygiene verification script"
        required: false
        type: string
        default: "./scripts/verify.sh"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run verification
        run: ${{ inputs.verify-command }}
